# Docker Compose for local development and production
# Includes PostgreSQL database and the API service

version: '3.8'

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  db:
    image: postgres:15-alpine
    container_name: hanif-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hanif}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hanif_secret}
      POSTGRES_DB: ${DB_NAME:-hanif_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hanif}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanif-network

  # =============================================================================
  # FastAPI Application
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hanif-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-hanif}:${DB_PASSWORD:-hanif_secret}@db:5432/${DB_NAME:-hanif_db}
      APP_NAME: ${APP_NAME:-Hanif Backend API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hanif-network
    volumes:
      # Mount code for development (optional)
      - ./app:/app/app:ro
      - ./routers:/app/routers:ro

  # =============================================================================
  # pgAdmin (Optional - for database management)
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hanif-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    networks:
      - hanif-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  hanif-network:
    driver: bridge
